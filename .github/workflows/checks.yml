name: Checks
on:
  push:
    branches: [main, dev, "feat/**", "feature/**"]
  pull_request:
    branches: [main, dev, "feat/**", "feature/**"]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: prism_test
          POSTGRES_DB: prism_test
          POSTGRES_PASSWORD: prism-ci-test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U prism_test -d prism_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.13'
      - run: python -m pip install -r backend/requirements.txt
      - run: python scripts/check_source_upload.py
      - run: python -m unittest backend.tests.test_api backend.tests.test_connection backend.tests.test_social_chat backend.tests.test_integration_boundaries -q
      - run: python -m unittest backend.tests.test_analyst_validation -q
      - run: python -m unittest backend.tests.test_article_intake -q
      - run: python -m unittest backend.tests.test_connected_news -q
      - run: python -m unittest backend.tests.test_accounts_editorial -q
      - run: python -m unittest backend.tests.test_local_reading backend.tests.test_news_topics backend.tests.test_reading_modes -q
      - run: python -m unittest discover -s backend/tests/rss -p 'test_*.py' -q
      - run: python -m unittest discover -s backend/tests/llm -p 'test_*.py' -q
      - run: python -m unittest backend.tests.test_database_integration -q
        env:
          PRISM_TEST_DATABASE_URL: postgresql+psycopg://prism_test:prism-ci-test-only@127.0.0.1:5432/prism_test
  clustering:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements-clustering-dev.txt
      - run: >-
          python -m pytest analysis/tests
          backend/tests/test_article_images.py
          backend/tests/test_cluster_feed.py
          backend/tests/test_cluster_preview.py
          backend/tests/test_cluster_store.py
          backend/tests/test_clustering_local.py
          backend/tests/test_clustering_snapshots.py
          backend/tests/test_scheduled_news.py
          backend/tests/test_public_deployment.py -q
        env:
          PRISM_DATA_SOURCE: fixture
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
  ai-extensions:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: prism_test
          POSTGRES_DB: prism_test
          POSTGRES_PASSWORD: prism-ci-test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U prism_test -d prism_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements-llm-dev.txt
      - run: python -m pytest backend/tests/test_ai_pipeline.py backend/tests/test_database_integration.py -q
        env:
          PRISM_DATA_SOURCE: fixture
          PRISM_ACCOUNTS_ENABLED: '1'
          PRISM_OPIK_ENABLED: '0'
          LANGSMITH_TRACING: 'false'
          PRISM_TEST_DATABASE_URL: postgresql+psycopg://prism_test:prism-ci-test-only@127.0.0.1:5432/prism_test
